<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabletop Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* Retro palette (dark arcade look in both themes) */
  :root {
    --bg: #1a1c2c; --panel: #262b44; --panel2: #333c57; --ink: #f4f4f4; --muted: #94b0c2; --line: #0f101a;
    --gold: #ffcd75; --green: #38b764; --dgreen: #257179; --safe: #3b5dc9; --risky: #b13e53; --sand: #ef7d57; --table: #0f101a;
    --pix: "Press Start 2P", ui-monospace, monospace; --txt: "VT323", ui-monospace, monospace;
  }
  :root[data-theme="light"] { --bg: #1a1c2c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 20px/1.15 var(--txt); display: flex; flex-direction: column; image-rendering: pixelated; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 4px solid var(--line); }
  header h1 { margin: 0; font: 14px var(--pix); color: var(--gold); text-shadow: 3px 3px 0 var(--line); letter-spacing: 1px; }
  header .meta { font: 10px var(--pix); color: var(--muted); }
  header a { color: var(--muted); font: 9px var(--pix); margin-left: auto; }
  main { flex: 1; display: flex; min-height: 0; }
  #boardWrap { flex: 1; min-width: 0; position: relative; background: var(--table); }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; }
  #board { touch-action: none; user-select: none; }
  #toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: var(--panel); color: var(--gold); padding: 12px 18px; font: 13px/1.6 var(--pix); border: 4px solid var(--line); box-shadow: 4px 4px 0 var(--line), inset 0 0 0 3px var(--panel2); opacity: 0; transition: opacity .15s; pointer-events: none; text-align: center; white-space: nowrap; }
  #toast.on { opacity: 1; }
  #toast small { display: block; font: 18px var(--txt); color: var(--ink); }
  aside { width: 480px; max-width: 100%; overflow-y: auto; padding: 12px 14px 40px; border-left: 4px solid var(--line); background: var(--bg); }
  @media (max-width: 900px) { main { flex-direction: column; } #boardWrap { height: 50vh; flex: none; } aside { width: 100%; border-left: 0; } #deck .who { display: none; } }
  .card { background: var(--panel); border: 4px solid var(--line); box-shadow: inset 0 0 0 3px var(--panel2), 4px 4px 0 var(--line); padding: 12px 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font: 10px var(--pix); color: var(--gold); letter-spacing: 1px; }
  .player { display: flex; align-items: center; gap: 10px; }
  .dot { width: 16px; height: 16px; border: 3px solid var(--line); flex: none; display: inline-block; }
  .pname { font: 13px var(--pix); }
  .meta { color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  button { font: 10px var(--pix); cursor: pointer; border: 3px solid var(--line); background: var(--panel2); color: var(--ink); padding: 9px 12px; box-shadow: 3px 3px 0 var(--line); }
  button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
  button:disabled { opacity: .3; cursor: not-allowed; }
  button.on { outline: 3px solid var(--gold); outline-offset: 2px; }
  .big { font-size: 13px; padding: 14px 20px; background: var(--green); color: var(--line); }
  .club { color: #fff; min-width: 90px; text-shadow: 2px 2px 0 #0008; }
  .club small { display: block; font-size: 8px; margin-top: 6px; letter-spacing: 2px; }
  .svgbox svg { display: block; width: 100%; height: auto; }
  #tray { display: block; margin-top: 8px; }
  #dicebox .hint { text-align: center; }
  .die { width: 58px; height: 58px; shape-rendering: crispEdges; }
  .die.tumble { animation: tumble .16s steps(2) infinite; }
  @keyframes tumble { 0% { transform: translate(0, 0); } 50% { transform: translate(-3px, -8px); } 100% { transform: translate(3px, 0); } }
  .dielbl { text-align: center; font: 8px var(--pix); color: var(--muted); margin-top: 6px; }
  .explain { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .chip { background: var(--panel2); border: 3px solid var(--line); padding: 6px 10px; font-size: 21px; }
  .chip b { color: var(--gold); font-weight: normal; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 4px 5px; text-align: center; border-bottom: 2px solid var(--line); font-size: 20px; }
  th { font: 8px var(--pix); color: var(--muted); }
  th:first-child, td:first-child { text-align: left; }
  td.cur, th.cur { background: #ffcd7522; }
  .hint { color: var(--muted); font-size: 19px; }
  .squares { display: flex; gap: 6px; }
  .sq { width: 36px; height: 36px; border: 3px solid; background: var(--bg); display: grid; place-items: center; font: 9px var(--pix); color: var(--muted); }
  .sq.filled { color: var(--line); }
  .sq.buy { cursor: pointer; animation: blink .8s steps(2) infinite; color: var(--gold); }
  @keyframes blink { 50% { background: var(--panel2); } }
  .bagrow { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 2px solid var(--line); }
  .bagrow .name { width: 78px; font: 9px var(--pix); }
  input[type=text] { font: 20px var(--txt); padding: 4px 8px; border: 3px solid var(--line); background: var(--bg); color: var(--ink); width: 140px; }
  label { cursor: pointer; }
  input[type=checkbox] { accent-color: var(--gold); width: 18px; height: 18px; vertical-align: -3px; }
  /* putter card */
  .pcard { width: 100%; border-collapse: separate; border-spacing: 4px; }
  .pcard th { font: 9px var(--pix); padding: 6px 2px; color: var(--ink); }
  .pcard th.s { background: var(--safe); } .pcard th.r { background: var(--risky); }
  .pcard td { border: 3px solid var(--line); padding: 4px 2px; font-size: 22px; background: var(--panel2); }
  .pcard td.ring { text-align: left; font: 9px var(--pix); background: transparent; border: none; white-space: nowrap; }
  .pcard td.in { font: 13px var(--pix); }
  .pcard td.in.s { color: #9db7ff; } .pcard td.in.r { color: #ff9aaa; }
  .pcard td.miss { color: var(--muted); }
  .pcard tr.dim td { opacity: .3; }
  .pcard tr.cur td { background: #ffcd7533; }
  .pcard tr.cur td.pick { cursor: pointer; outline: 3px solid var(--gold); }
  .pcard tr.cur td.pick:hover { background: #ffcd7566; }
  .ringpx { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; margin-right: 6px; image-rendering: pixelated; }
  .coin { color: var(--gold); }
  /* gamble meters */
  .meter { margin-top: 8px; }
  .meter svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
  .mlabel { font: 8px var(--pix); color: var(--muted); margin: 4px 0 2px; }
  #dicebox { display: flex; gap: 16px; justify-content: center; align-items: flex-end; min-height: 76px; }
  /* deck of club cards (bottom of the screen) */
  #deck { height: 196px; flex: none; display: flex; align-items: flex-end; gap: 18px; padding: 0 18px 12px; border-top: 4px solid var(--line);
    background: #1d3a2a repeating-linear-gradient(45deg, #1f3e2d 0 4px, #1b3628 4px 8px); overflow-x: auto; overflow-y: hidden; }
  #deck .who { font: 9px var(--pix); color: var(--gold); min-width: 110px; padding-bottom: 18px; line-height: 2; text-shadow: 2px 2px 0 var(--line); }
  #deck .hand { display: flex; align-items: flex-end; padding-top: 30px; margin: 0 auto; }
  .gcard { width: 104px; height: 150px; flex: none; margin: 0 -6px; background: #262b44; border: 4px solid var(--tc); box-shadow: 4px 4px 0 var(--line), inset 0 0 0 3px #1a1c2c;
    display: flex; flex-direction: column; align-items: center; padding: 7px 4px 5px; cursor: pointer; transition: transform .12s steps(3); position: relative; }
  .gcard:hover:not(.off) { transform: translateY(-16px) rotate(0deg) !important; z-index: 5; }
  .gcard.sel { transform: translateY(-28px) rotate(0deg) !important; z-index: 6; box-shadow: 4px 4px 0 var(--line), inset 0 0 0 3px #1a1c2c, 0 0 0 4px var(--gold); }
  .gcard.off { filter: grayscale(.85) brightness(.55); cursor: not-allowed; }
  .gname { font: 8px var(--pix); color: #fff; letter-spacing: 1px; }
  .gicon svg { width: 64px; height: 64px; display: block; margin: 6px 0 4px; image-rendering: pixelated; }
  .gpips { font: 7px var(--pix); color: var(--tc); letter-spacing: 1px; }
  .gstat { font: 18px/1 var(--txt); color: var(--ink); margin-top: 3px; }
  .gtier { position: absolute; bottom: -14px; font: 7px var(--pix); background: var(--tc); color: var(--line); padding: 3px 5px; border: 2px solid var(--line); }
  .gbadge { position: absolute; top: -14px; right: -10px; font: 8px var(--pix); background: var(--gold); color: var(--line); padding: 4px 5px; border: 2px solid var(--line); }
  /* shop */
  .offers { display: flex; gap: 18px; justify-content: center; padding: 22px 0 10px; flex-wrap: wrap; }
  .offer { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .offer .gcard { margin: 0; cursor: default; }
  .offer .gcard:hover { transform: none !important; }
  .price { font: 11px var(--pix); color: var(--gold); }
  .price s { color: var(--muted); margin-right: 6px; }
  .sold { font: 11px var(--pix); color: var(--muted); padding: 12px; }
</style>
</head>
<body>
<header>
  <h1>⛳ TABLETOP GOLF</h1>
  <span class="meta" id="hdr"></span>
  <a href="index.html">DESIGN LAB ›</a>
</header>
<main>
  <section id="boardWrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><image id="terrain" preserveAspectRatio="none" style="image-rendering:pixelated;image-rendering:crisp-edges"/><g id="gover"></g><g id="ganim"></g></svg>
    <div id="toast"></div>
  </section>
  <aside id="panel"></aside>
</main>
<footer id="deck"></footer>
<script src="engine.js"></script>
<script src="components.js"></script>
<script src="game.js"></script>
</body>
</html>
