="400" fill="#111">   on that fan line, find the</text><text x="284" y="110" font-size="3.6" font-weight="400" fill="#111">   7i mark: ball there</text><text x="220" y="310" font-size="3.6" fill="#444">No distances on the cards: one shared bag ruler and one fan.</text><text x="220" y="316" font-size="3.6" fill="#444">Upgrading = the next tier's card: more ON TARGET and STRAIGHT.</text><text x="220" y="330" font-size="3" fill="#777">Illustration · pieces print at 1 mm = 1 yd</text></svg>